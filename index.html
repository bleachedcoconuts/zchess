}

// ── Circular move timer: theme-colored ring for the first phase, switches
// to the current player's color once the move limit is exceeded and the
// ring starts representing their draining main clock instead. ─────────────
const circleRing = document.getElementById('circleTimerProgress');
const circleLabel = document.getElementById('circleTimerLabel');
const circleSub = document.getElementById('circleTimerSub');
const CIRCLE_C = 2 * Math.PI * 42;
function updateCircleTimer() {
  if (!circleRing) return;
  if (!gameStarted) {
    circleRing.style.stroke = '#3a4262';
    circleRing.style.strokeDashoffset = '0';
    circleRing.classList.remove('overage');
    circleLabel.textContent = formatClock(MOVE_LIMIT_MS);
    circleSub.textContent = 'move timer';
    return;
  }
  if (gameOver) {
    circleRing.style.stroke = '#888';
    circleRing.style.strokeDashoffset = '0';
    circleRing.classList.remove('overage');
    circleLabel.textContent = '—';
    circleSub.textContent = 'game over';
    return;
  }
  const elapsed = currentMoveElapsed();
  if (elapsed <= MOVE_LIMIT_MS) {
    const frac = MOVE_LIMIT_MS > 0 ? elapsed / MOVE_LIMIT_MS : 1;
    circleRing.style.stroke = RING_WHITE;
    circleRing.style.strokeDashoffset = String(CIRCLE_C * frac);
    circleRing.classList.remove('overage');
    circleLabel.textContent = formatClock(MOVE_LIMIT_MS - elapsed);
    circleSub.textContent = paused ? 'move timer — paused' : 'move timer';
  } else {
    const bankMs = liveClock(turn);
    const frac = 1 - Math.max(0, Math.min(1, MAIN_CLOCK_MS > 0 ? bankMs / MAIN_CLOCK_MS : 0));
    circleRing.style.stroke = playerColor(turn, n);
    circleRing.style.strokeDashoffset = String(CIRCLE_C * frac);
    circleRing.classList.add('overage');
    circleLabel.textContent = formatClock(bankMs);
    circleSub.textContent = paused ? `${playerLabel(turn)} clock — paused` : `${playerLabel(turn)} clock`;
  }
}

function draw() {
  aVal.textContent = n;
  const a = (2 * Math.PI) / n;
  const zoom = boardZoom;

  viewRotation = computeViewRotation(n);

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(boardPan.x, boardPan.y);
  const scale = (W / 5) * zoom;
  ctx.scale(scale, -scale);
  ctx.rotate(viewRotation);
  lastDrawnZoom = zoom;

  const rList = [0,1,2,3,4,5,6,7,8];
  const maxR = 8;
  const angleTerm = ((2 * Math.PI / a) - 2) * Math.PI / (4 * Math.PI / a);
  const D = Math.abs(1 / Math.tan(angleTerm));
  const z = -D/5, kk = -2*D/5, w = -3*D/5, j = -4*D/5;
  const envA = Math.abs(2 * Math.cos(a / 2));

  function lineTo(x, y, first) { if (first) ctx.moveTo(x, y); else ctx.lineTo(x, y); }

  function spokePt(r, frac) { return [frac*envA*Math.sin(r*a), frac*envA*Math.cos(r*a)]; }
  function boundaryPt(r, t) { return [envA*(Math.sin(r*a)+t*Math.cos(r*a)), envA*(Math.cos(r*a)-t*Math.sin(r*a))]; }
  function lineIntersect(p1, d1, p2, d2) {
    const denom = d1[0]*d2[1] - d1[1]*d2[0];
    if (Math.abs(denom) < 1e-10) return null;
    const t = ((p2[0]-p1[0])*d2[1] - (p2[1]-p1[1])*d2[0]) / denom;
    return [p1[0]+t*d1[0], p1[1]+t*d1[1]];
  }
  const levels = [0, 1/5, 2/5, 3/5, 4/5, 1];
  function kiteGrid(m) {
    const grid = [];
    for (let ip = 0; ip < 6; ip++) {
      const cfp = levels[ip];
      const pA = spokePt(m, cfp), pB = boundaryPt(m+1, -cfp*D);
      const dP = [pB[0]-pA[0], pB[1]-pA[1]];
      const row = [];
      for (let iq = 0; iq < 6; iq++) {
        const cfq = levels[iq];
        const qA = spokePt(m+1, cfq), qB = boundaryPt(m, cfq*D);
        const dQ = [qB[0]-qA[0], qB[1]-qA[1]];
        row.push(lineIntersect(pA, dP, qA, dQ));
      }
      grid.push(row);
    }
    return grid;
  }
  const g1 = kiteGrid(1), g2 = kiteGrid(2);

  const wedgeCells = {};
  for (let wi = 0; wi < n; wi++) {
    const ang = wi * a;
    for (let ip = 0; ip < 5; ip++) for (let iq = 0; iq < 5; iq++) {
      const p00 = g1[ip][iq], p10 = g1[ip+1][iq], p11 = g1[ip+1][iq+1], p01 = g1[ip][iq+1];
      if (!p00 || !p10 || !p11 || !p01) continue;
      const c0 = rotPt(p00[0], p00[1], ang), c1 = rotPt(p10[0], p10[1], ang);
      const c2 = rotPt(p11[0], p11[1], ang), c3 = rotPt(p01[0], p01[1], ang);
      const cx = (c0[0]+c1[0]+c2[0]+c3[0])/4, cy = (c0[1]+c1[1]+c2[1]+c3[1])/4;
      wedgeCells[`${wi},${ip},${iq}`] = {pts:[c0,c1,c2,c3], cx, cy};
    }
  }
  lastWedgeCells = wedgeCells;

  const kiteCells = {};
  for (let ip = 0; ip < 5; ip++) for (let iq = 0; iq < 5; iq++) {
    [[1,g1],[2,g2]].forEach(([kite,g]) => {
      const c0=g[ip][iq],c1=g[ip+1][iq],c2=g[ip+1][iq+1],c3=g[ip][iq+1];
      if (!c0||!c1||!c2||!c3) return;
      const cx=(c0[0]+c1[0]+c2[0]+c3[0])/4, cy=(c0[1]+c1[1]+c2[1]+c3[1])/4;
      kiteCells[`${kite},${ip},${iq}`] = {pts:[c0,c1,c2,c3],cx,cy};
    });
  }
  function kiteNeighbours(key) {
    const [kite,ip,iq] = key.split(',').map(Number);
    const nb = [];
    if (ip>0) nb.push(`${kite},${ip-1},${iq}`);
    if (ip<4) nb.push(`${kite},${ip+1},${iq}`);
    if (iq>0) nb.push(`${kite},${ip},${iq-1}`);
    if (iq<4) nb.push(`${kite},${ip},${iq+1}`);
    if (kite===1&&ip===0) nb.push(`2,${iq},0`);
    if (kite===2&&iq===0) nb.push(`1,${ip},0`);
    return nb;
  }
  const kiteKeys = Object.keys(kiteCells);
  let cxAll=0,cyAll=0;
  kiteKeys.forEach(k=>{cxAll+=kiteCells[k].cx;cyAll+=kiteCells[k].cy;});
  cxAll/=kiteKeys.length; cyAll/=kiteKeys.length;
  let anchor=kiteKeys[0], bestDist=Infinity;
  kiteKeys.forEach(k=>{
    const dx=kiteCells[k].cx-cxAll, dy=kiteCells[k].cy-cyAll, d=dx*dx+dy*dy;
    if(d<bestDist){bestDist=d;anchor=k;}
  });
  const kiteParity = {[anchor]:0};
  const kq=[anchor]; let kh=0;
  while(kh<kq.length){
    const k=kq[kh++]; const p=kiteParity[k];
    for(const nb of kiteNeighbours(k)){
      if(!(nb in kiteCells)||nb in kiteParity) continue;
      kiteParity[nb]=1-p; kq.push(nb);
    }
  }

  const sliceCorners = [];
  for (let r = 0; r < n; r++) {
    sliceCorners.push({x: envA*(Math.sin(r*a)+D*Math.cos(r*a)), y: envA*(Math.cos(r*a)-D*Math.sin(r*a))});
  }
  const s1x=envA*Math.sin(1*a), s1y=envA*Math.cos(1*a);
  const s3x=envA*Math.sin(3*a), s3y=envA*Math.cos(3*a);
  const ang1=Math.atan2(s1x,s1y), ang3=Math.atan2(s3x,s3y);
  function inSlice(px,py) {
    let ang=Math.atan2(px,py), a1=ang1, a3=ang3;
    if(a3<a1) a3+=2*Math.PI;
    if(ang<a1) ang+=2*Math.PI;
    return ang>=a1 && ang<=a3;
  }

  lastCellGeo = {};
  const edgeG=[]; const cellGeo = lastCellGeo;
  for(let i=0;i<n;i++){
    const p0=sliceCorners[i], p1=sliceCorners[(i+1)%n];
    const ex=p1.x-p0.x, ey=p1.y-p0.y, edgeLen=Math.sqrt(ex*ex+ey*ey);
    if(edgeLen<1e-10){edgeG.push(null);continue;}
    const ux=ex/edgeLen, uy=ey/edgeLen;
    let nx=-uy, ny=ux;
    const mx=(p0.x+p1.x)/2, my=(p0.y+p1.y)/2;
    if(nx*mx+ny*my<0){nx=-nx;ny=-ny;}
    const cellW=edgeLen*(4/5)/8, cellH=cellW;
    const originX=p0.x+(edgeLen/10)*ux, originY=p0.y+(edgeLen/10)*uy;
    edgeG.push({ux,uy,nx,ny,cellW,cellH,originX,originY});
    for(let col=0;col<8;col++) for(let row=0;row<2;row++){
      const x0=originX+col*cellW*ux+row*cellH*nx, y0=originY+col*cellW*uy+row*cellH*ny;
      const x1=x0+cellW*ux, y1=y0+cellW*uy;
      const x2=x1+cellH*nx, y2=y1+cellH*ny;
      const x3=x0+cellH*nx, y3=y0+cellH*ny;
      cellGeo[`${i},${col},${row}`]={x0,y0,x1,y1,x2,y2,x3,y3,ccx:(x0+x2)/2, ccy:(y0+y2)/2, cellW};
    }
  }
  lastEdgeGeom = edgeG;

  const checkerParity={};
  const anchorKey=`2,3,0`;
  if(cellGeo[anchorKey]&&inSlice(cellGeo[anchorKey].ccx,cellGeo[anchorKey].ccy)){
    checkerParity[anchorKey]=0;
    const queue=[[2,3,0]]; let head=0;
    while(head<queue.length){
      const [ei,col,row]=queue[head++];
      const p=checkerParity[`${ei},${col},${row}`];
      const neighbours=[
        {ni:ei,nc:col,nr:1-row,flip:0},
        ...(col>0?[{ni:ei,nc:col-1,nr:row,flip:0}]:[{ni:(ei-1+n)%n,nc:7,nr:row,flip:1}]),
        ...(col<7?[{ni:ei,nc:col+1,nr:row,flip:0}]:[{ni:(ei+1)%n,nc:0,nr:row,flip:1}]),
      ];
      for(const {ni,nc,nr,flip} of neighbours){
        const nkey=`${ni},${nc},${nr}`;
        if(checkerParity[nkey]!==undefined) continue;
        const cd=cellGeo[nkey];
        if(!cd||!inSlice(cd.ccx,cd.ccy)) continue;
        checkerParity[nkey]=(1-p+flip)%2;
        queue.push([ni,nc,nr]);
      }
    }
  }

  const iters = n;
  for(let kki=0; kki<iters; kki++){
    const rotAngle = kki * (2*Math.PI/n);
    const cosR=Math.cos(rotAngle), sinR=Math.sin(rotAngle);
    function rot(x,y){ return [x*cosR-y*sinR, x*sinR+y*cosR]; }
    ctx.save();
    kiteKeys.forEach(key=>{
      const cd=kiteCells[key];
      const bright=(kiteParity[key]??0)===0;
      const fill=sliceColor(kki,n,bright);
      if(!fill) return; // non-hue-shifting kite — leave it transparent
      const rpts=cd.pts.map(([x,y])=>rot(x,y));
      ctx.beginPath();
      ctx.moveTo(rpts[0][0],rpts[0][1]);
      for(let i=1;i<4;i++) ctx.lineTo(rpts[i][0],rpts[i][1]);
      ctx.closePath();
      ctx.fillStyle=fill; ctx.fill();
    });
    for(let i=0;i<n;i++){
      if(!edgeG[i]) continue;
      for(let col=0;col<8;col++) for(let row=0;row<2;row++){
        const key=`${i},${col},${row}`;
        const cd=cellGeo[key];
        const {x0,y0,x1,y1,x2,y2,x3,y3,ccx,ccy,cellW}=cd;
        if(!inSlice(ccx,ccy)) continue;
        const rawP = checkerParity[key] ?? 0;
        const flipEdge = (n !== 4 && n !== 7);
        const bright = (flipEdge ? 1 - rawP : rawP) === 0;
        const fill=sliceColor(kki,n,bright);
        if(!fill) continue; // non-hue-shifting square — leave it transparent
        const rpts=[rot(x0,y0),rot(x1,y1),rot(x2,y2),rot(x3,y3)];
        ctx.beginPath();
        ctx.moveTo(rpts[0][0],rpts[0][1]);
        for(let ii=1;ii<4;ii++) ctx.lineTo(rpts[ii][0],rpts[ii][1]);
        ctx.closePath();
        ctx.fillStyle=fill; ctx.fill();
      }
    }
    ctx.restore();
  }

  // ── Playable-cell geometry (outlines hidden — colors only) ─────────────
  const drawQuad = (cd) => {
    ctx.beginPath();
    ctx.moveTo(cd.pts[0][0], cd.pts[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(cd.pts[i][0], cd.pts[i][1]);
    ctx.closePath();
  };

  // ── Last move + selection + legal-move highlights ──────────────────────
  // "preview*" is used when the selected piece can't actually be moved by
  // this client right now (opponent's piece, or your own piece out of
  // turn) — a cooler, flatter tone than the actionable move/capture/select
  // colors so it reads as "informational" rather than "you can do this."
  const HL = theme === 'pastel'
    ? { last: 'rgba(90,70,120,0.14)', capture: 'rgba(214,60,90,0.5)', move: 'rgba(40,150,90,0.4)', selected: 'rgba(224,150,30,0.5)',
        previewMove: 'rgba(90,110,140,0.35)', previewSelected: 'rgba(90,110,140,0.55)' }
    : { last: 'rgba(255,255,255,0.12)', capture: 'rgba(255,60,60,0.6)', move: 'rgba(0,255,80,0.5)', selected: 'rgba(255,210,60,0.55)',
        previewMove: 'rgba(140,160,190,0.32)', previewSelected: 'rgba(140,160,190,0.5)' };
  if (lastMoveHighlight) {
    ctx.fillStyle = HL.last;
    const fg = cellGeoOfGlobal(keyToCell(lastMoveHighlight.from));
    const tg = cellGeoOfGlobal(keyToCell(lastMoveHighlight.to));
    if (fg) { drawQuad(fg); ctx.fill(); }
    if (tg) { drawQuad(tg); ctx.fill(); }
  }
  if (selected) {
    for (const m of legalMoves) {
      const mg = cellGeoOfGlobal(m.cell);
      if (!mg) continue;
      ctx.fillStyle = selectable ? (m.capture ? HL.capture : HL.move) : HL.previewMove;
      drawQuad(mg); ctx.fill();
    }
    const sg = cellGeoOfGlobal(selected);
    if (sg) {
      ctx.fillStyle = selectable ? HL.selected : HL.previewSelected;
      drawQuad(sg); ctx.fill();
    }
  }

  ctx.restore();

  // ── Pieces (drawn in screen space — text must not be y-flipped) ────────
  for (const key in board) {
    const info = board[key];
    if (!seatFilled(info.player)) continue;
    const g = cellGeoOfGlobal(keyToCell(key));
    if (!g) continue;
    const [rcx, rcy] = rotateByAngle(g.cx, g.cy, viewRotation);
    const sx = boardPan.x + rcx*scale, sy = boardPan.y - rcy*scale;
    const side = Math.hypot(g.pts[1][0]-g.pts[0][0], g.pts[1][1]-g.pts[0][1]);
    const r = Math.max(4, side*scale*0.42);
    ctx.font = `${r*1.7}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const glyph = GLYPH[info.type];
    // Chess glyphs sit visually high/low within their font-metric box, so
    // "middle" baseline doesn't actually center them on the tile. Measure
    // the glyph's real ink bounds and center on those instead.
    const gm = ctx.measureText(glyph);
    const ascent = gm.actualBoundingBoxAscent ?? r*0.85;
    const descent = gm.actualBoundingBoxDescent ?? r*0.15;
    const drawY = sy + (ascent - descent) / 2;
    ctx.fillStyle = playerColor(info.player, n); ctx.fillText(glyph, sx, drawY);
  }

  updateBoardClocks();

  updateStatusPanel();
}

function handleCellClick(cell) {
  if (!gameStarted || gameOver || paused || pendingPromotion) return;
  const key = ck(cell);
  const occ = board[key];

  if (selected) {
    if (ck(selected) === key) { selected = null; legalMoves = []; selectable = false; draw(); return; }
    // Only an actually-controllable selection can execute a move by
    // clicking one of its highlighted squares — a preview selection just
    // switches the preview to whatever was clicked (or clears it).
    if (selectable) {
      const mv = legalMoves.find(m => ck(m.cell) === key);
      if (mv) {
        executeMove(ck(selected), mv.cell, mv);
        selected = null; legalMoves = []; selectable = false;
        draw();
        return;
      }
    }
    if (occ) {
      selected = cell;
      legalMoves = getLegalMoves(cell, occ, n, cellExistsGlobal, board);
      selectable = canControlPiece(occ);
    } else {
      selected = null; legalMoves = []; selectable = false;
    }
    draw();
    return;
  }

  if (occ) {
    // Any piece can be selected to preview its moves — whether it's an
    // opponent's piece, or your own piece out of turn. Only a piece that
    // passes canControlPiece can actually be moved from this selection.
    selected = cell;
    legalMoves = getLegalMoves(cell, occ, n, cellExistsGlobal, board);
    selectable = canControlPiece(occ);
    draw();
  }
}

function handleCanvasTap(clientX, clientY) {
  if (!lastWedgeCells || !gameStarted || paused || pendingPromotion) return;
  const rect = canvas.getBoundingClientRect();
  const mx = clientX-rect.left, my = clientY-rect.top;
  const scale = (W/5)*boardZoom;
  const rx = (mx-boardPan.x)/scale, ry = -(my-boardPan.y)/scale;
  const [wx, wy] = rotateByAngle(rx, ry, -viewRotation);

  let clicked = null;
  for (const key in lastWedgeCells) {
    if (pointInQuad(wx, wy, lastWedgeCells[key].pts)) {
      const [wi, ip, iq] = key.split(',').map(Number);
      clicked = {type:'wedge', w:wi, ip, iq};
      break;
    }
  }
  if (!clicked) {
    outer:
    for (let ei = 0; ei < n; ei++) for (let col = 0; col < 8; col++) for (let row = 0; row < 2; row++) {
      const g = lastCellGeo[`${ei},${col},${row}`];
      if (!g) continue;
      const pts = [[g.x0,g.y0],[g.x1,g.y1],[g.x2,g.y2],[g.x3,g.y3]];
      if (pointInQuad(wx, wy, pts)) { clicked = {type:'edge', ei, col, row}; break outer; }
    }
  }
  if (clicked) handleCellClick(clicked);
}

// ── Mouse: drag to pan, click (no movement) to select/move a piece ─────────
const dragState = {active:false, moved:false, sx:0, sy:0, spx:0, spy:0};
canvas.addEventListener('mousedown', (ev) => {
  dragState.active = true; dragState.moved = false;
  dragState.sx = ev.clientX; dragState.sy = ev.clientY;
  dragState.spx = boardPan.x; dragState.spy = boardPan.y;
  canvas.style.cursor = 'grabbing';
  ev.preventDefault();
});
window.addEventListener('mousemove', (ev) => {
  if (!dragState.active) return;
  const dx = ev.clientX - dragState.sx, dy = ev.clientY - dragState.sy;
  if (!dragState.moved && Math.hypot(dx, dy) > 4) dragState.moved = true;
  if (dragState.moved) {
    boardPan.x = dragState.spx + dx; boardPan.y = dragState.spy + dy;
    draw();
  }
});
window.addEventListener('mouseup', (ev) => {
  if (!dragState.active) return;
  dragState.active = false;
  canvas.style.cursor = 'grab';
  if (!dragState.moved) handleCanvasTap(ev.clientX, ev.clientY);
});

// ── Wheel: zoom anchored at the cursor ──────────────────────────────────────
canvas.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX-rect.left, my = ev.clientY-rect.top;
  const cur = boardZoom;
  const factor = ev.deltaY < 0 ? 1.1 : 0.9;
  const nz = clampZoom(cur * factor);
  boardPan.x = mx - (mx-boardPan.x)*(nz/cur);
  boardPan.y = my - (my-boardPan.y)*(nz/cur);
  boardZoom = nz;
  draw();
}, {passive:false});

// ── Touch: 1-finger pan + tap, 2-finger pinch zoom ──────────────────────────
let t1x=0, t1y=0, tpx=0, tpy=0, tPinchDist=0, tPinchZoom=0, tTapX=0, tTapY=0, tMoved=false;
function tDist(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
function tMid(a,b,r){ return {x:(a.clientX+b.clientX)/2-r.left, y:(a.clientY+b.clientY)/2-r.top}; }
canvas.addEventListener('touchstart', (ev) => {
  ev.preventDefault();
  if (ev.touches.length === 1) {
    t1x = ev.touches[0].clientX; t1y = ev.touches[0].clientY;
    tpx = boardPan.x; tpy = boardPan.y;
    tTapX = t1x; tTapY = t1y; tMoved = false;
  } else if (ev.touches.length >= 2) {
    tMoved = true;
    const [a,b] = [ev.touches[0], ev.touches[1]];
    tPinchDist = tDist(a,b);
    tPinchZoom = boardZoom;
    tpx = boardPan.x; tpy = boardPan.y;
  }
}, {passive:false});
canvas.addEventListener('touchmove', (ev) => {
  ev.preventDefault();
  if (!tMoved && ev.touches.length === 1 && Math.hypot(ev.touches[0].clientX-tTapX, ev.touches[0].clientY-tTapY) > 10) tMoved = true;
  const rect = canvas.getBoundingClientRect();
  if (ev.touches.length === 1) {
    boardPan.x = tpx + (ev.touches[0].clientX - t1x);
    boardPan.y = tpy + (ev.touches[0].clientY - t1y);
    draw();
  } else if (ev.touches.length >= 2) {
    const [a,b] = [ev.touches[0], ev.touches[1]];
    const dist = tDist(a,b);
    const nz = clampZoom(tPinchZoom * (dist/tPinchDist));
    const mid = tMid(a,b,rect);
    boardPan.x = mid.x - (mid.x-tpx)*(nz/tPinchZoom);
    boardPan.y = mid.y - (mid.y-tpy)*(nz/tPinchZoom);
    boardZoom = nz;
    draw();
  }
}, {passive:false});
canvas.addEventListener('touchend', (ev) => {
  if (ev.touches.length === 1) {
    tpx = boardPan.x; tpy = boardPan.y;
    t1x = ev.touches[0].clientX; t1y = ev.touches[0].clientY;
  }
  if (!tMoved && ev.changedTouches.length === 1) {
    const t = ev.changedTouches[0];
    if (Math.hypot(t.clientX-tTapX, t.clientY-tTapY) < 15) handleCanvasTap(t.clientX, t.clientY);
  }
}, {passive:false});

document.getElementById('newGameBtn').addEventListener('click', startNewGameFromSetup);
document.getElementById('abortBtn').addEventListener('click', abortGame);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('fitBtn').addEventListener('click', zoomToFit);

aSlider.addEventListener('input', () => {
  if (gameStarted) return;
  previewSetup(parseInt(aSlider.value, 10));
});

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const firstLoad = boardPan.x === null;
  const oldW = W, oldH = H;
  W = rect.width; H = rect.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (firstLoad) {
    boardPan.x = W / 2; boardPan.y = H / 2;
    boardZoom = boardZoomToFit(n);
  } else {
    boardPan.x += (W - oldW) / 2; boardPan.y += (H - oldH) / 2;
  }
  draw();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
resizeCanvas();

updateStatusPanel();
setInterval(tickClock, 250);

// Best-effort background sweep on page load, so an abandoned room can get
// cleaned up by anyone opening the app — not just someone who happens to
// visit that exact room code.
(async () => {
  try { await ensureSignedIn(); await sweepAbandonedRooms(); } catch (e) {}
})();
</script>
